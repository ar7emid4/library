<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Library</title>
</head>
<body>

    <button id="show-dialog-btn">New Book</button>

    <dialog closedby="any">
        <form class="new-book-form" method="dialog">
            <label for="title">Book title:</label>
            <input id="title" name="title" type="text">

            <label for="author">Book author:</label>
            <input id="author" name="author" type="text">

            <label for="pages">Book pages:</label>
            <input id="pages" name="pages" type="text">

            <fieldset>
                <legend>Book is read:</legend>

                <label for="isRead">Yes</label>
                <input id="isRead" name="read" value="Read" type="radio">

                <label for="notRead">No</label>
                <input id="notRead" name="read" value="Unread" type="radio">
            </fieldset>

            <button id="submit-dialog-btn">Add Book</button>
        </form>
    </dialog>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Author</th>
                <th>Pages</th>
                <th>Status</th>
                <th></th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <script>
        const myLibrary = [];

        function Book(title, author, pages, read) {
            if (!new.target) {
                throw Error("You must use the 'new' operator to call the constructor");
            }

            this.title = title;
            this.author = author;
            this.pages = pages;
            this.read = read;
        }

        Book.prototype.toggleReadStatus = function() {
            if (this.read == "Read") this.read = "Unread"
            else this.read = "Read";
        }

        function displayLibrary(library) {
            document.querySelector("tbody").textContent = "";
            for (let i = library.length - 1; i >= 0; i--) {
                let tableRow = document.createElement("tr");
                document.querySelector("tbody").appendChild(tableRow);

                let bookTitle = document.createElement("td");
                bookTitle.textContent = library[i].title;
                tableRow.appendChild(bookTitle);

                let bookAuthor = document.createElement("td");
                bookAuthor.textContent = library[i].author;
                tableRow.appendChild(bookAuthor);

                let bookPages = document.createElement("td");
                bookPages.textContent = library[i].pages;
                tableRow.appendChild(bookPages);

                let bookRead = document.createElement("td");
                let readBtn = document.createElement("button");
                readBtn.textContent = library[i].read;
                readBtn.addEventListener("click", () => {
                    library[i].toggleReadStatus();
                    readBtn.textContent = library[i].read;
                });
                bookRead.appendChild(readBtn);
                tableRow.appendChild(bookRead);

                let bookDelete = document.createElement("td");
                let deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";
                deleteBtn.addEventListener("click", (event) => {
                event.target.parentElement.parentElement.remove();
                library.splice(i, 1);
                });
                bookDelete.appendChild(deleteBtn);
                tableRow.appendChild(bookDelete);
            }
        }

        function addBookToLibrary(title, author, pages, read) {
            myLibrary.push(new Book(title, author, pages, read));
            displayLibrary(myLibrary);
        }

        let showDialogButton = document.querySelector("#show-dialog-btn");
        let dialog = document.querySelector("dialog");
        showDialogButton.addEventListener("click", () => dialog.show());

        let newBookForm = document.querySelector(".new-book-form");
        newBookForm.addEventListener("submit", (event) => {
            event.preventDefault();

            let formData = new FormData(newBookForm);
            let formEntries = (Object.fromEntries(formData));
            dialog.close();
            newBookForm.reset();

            addBookToLibrary(formEntries.title, formEntries.author, formEntries.pages, formEntries.read)
        })

        addBookToLibrary("Norwegian Wood", "Haruki Murakami", "296", "Read");
    </script>
</body>
</html>
