<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
</head>
<body>

    <button id="show-dialog-btn">New Book</button>

    <dialog closedby="any">
        <form class="new-book-form" method="dialog">
            <label for="title">Book title:</label>
            <input id="title" name="title" type="text">

            <label for="author">Book author:</label>
            <input id="author" name="author" type="text">

            <label for="pages">Book pages:</label>
            <input id="pages" name="pages" type="text">

            <fieldset>
                <legend>Book is read:</legend>

                <label for="isRead">Yes</label>
                <input id="isRead" name="read" value="true" type="radio">

                <label for="notRead">No</label>
                <input id="notRead" name="read" value="false" type="radio">
            </fieldset>

            <button id="submit-dialog-btn">Add Book</button>
        </form>
    </dialog>

    <div class="book-list">

    </div>

    <script>
        const myLibrary = [];

        function Book(title, author, pages, read) {
            if (!new.target) {
                throw Error("You must use the 'new' operator to call the constructor");
            }

            this.title = title;
            this.author = author;
            this.pages = pages;
            this.read = read;
        }

        function displayLibrary(library) {
            document.querySelector(".book-list").textContent = "";
            for (let book of library) {
                let bookCard = document.createElement("div");
                document.querySelector(".book-list").appendChild(bookCard);

                let bookTitle = document.createElement("p");
                bookTitle.textContent = book.title;
                bookCard.appendChild(bookTitle);

                let bookAuthor = document.createElement("p");
                bookAuthor.textContent = book.author;
                bookCard.appendChild(bookAuthor);

                let bookPages = document.createElement("p");
                bookPages.textContent = book.pages;
                bookCard.appendChild(bookPages);

                let bookRead = document.createElement("p");
                bookRead.textContent = book.read;
                bookCard.appendChild(bookRead);
            }
        }

        function addBookToLibrary(title, author, pages, read) {
            myLibrary.push(new Book(title, author, pages, read));
            displayLibrary(myLibrary);
        }

        let showDialogButton = document.querySelector("#show-dialog-btn");
        let dialog = document.querySelector("dialog");
        showDialogButton.addEventListener("click", () => dialog.show());

        let newBookForm = document.querySelector(".new-book-form");
        newBookForm.addEventListener("submit", (event) => {
            event.preventDefault();

            let formData = new FormData(newBookForm);
            let formEntries = (Object.fromEntries(formData));
            dialog.close();

            addBookToLibrary(formEntries.title, formEntries.author, formEntries.pages, formEntries.read)
        })

        addBookToLibrary("title", "author", "pages", "read");

    </script>
</body>
</html>
